<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aadhaar Card (Sample)</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; max-width: 400px; border-top: 8px solid #f59e0b; }
    h1 { color: #1f2937; font-size: 24px; margin-bottom: 10px; }
    p { color: #6b7280; font-size: 14px; }
    .number { font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #111827; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/c/cf/Aadhaar_Logo.svg/1200px-Aadhaar_Logo.svg.png" alt="Aadhaar" width="100" style="margin-bottom: 20px;">
    <h1>Aarav Sharma</h1>
    <p>DOB: 12/05/1990 &nbsp; | &nbsp; MALE</p>
    <div class="number">XXXX XXXX 1234</div>
    <p>Government of India<br><em>Sample Document for Demo</em></p>
  </div>
</body>
</html>
