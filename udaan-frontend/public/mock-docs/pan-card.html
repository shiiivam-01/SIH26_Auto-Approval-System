<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PAN Card (Sample)</title>
  <style>
    body { font-family: 'Courier New', Courier, monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
    .card { background: #e0f2fe; padding: 20px 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; border: 1px solid #bae6fd; position: relative; }
    .header { font-size: 12px; font-family: sans-serif; text-align: center; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #93c5fd; padding-bottom: 10px; }
    .label { font-size: 10px; color: #475569; margin-top: 15px; }
    .val { font-size: 16px; font-weight: bold; color: #1e293b; }
    .pan-number { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #1d4ed8; margin-top: 20px; background: white; padding: 10px; text-align: center; border-radius: 4px; border: 1px dashed #93c5fd; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">INCOME TAX DEPARTMENT<br>GOVT. OF INDIA</div>
    
    <div class="label">Name</div>
    <div class="val">AARAV SHARMA</div>
    
    <div class="label">Father's Name</div>
    <div class="val">R. K. SHARMA</div>
    
    <div class="label">Date of Birth</div>
    <div class="val">12/05/1990</div>
    
    <div class="pan-number">ABCDE1234F</div>
    
    <div style="text-align: center; margin-top: 20px; font-size: 10px; font-family: sans-serif; color: #64748b;">Specimen Document for UDAAN Demo</div>
  </div>
</body>
</html>
